apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasight-vllm-gpu
  labels:
    app: datasight-vllm-gpu
spec:
  replicas: 0
  selector:
    matchLabels:
      app: datasight-vllm-gpu
  template:
    metadata:
      labels:
        app: datasight-vllm-gpu
    spec:
      containers:
        - name: vllm
          image: image-registry.openshift-image-registry.svc:5000/ub-datasight/datasight-vllm-gpu:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: VLLM_MODEL
              value: Qwen/Qwen2.5-0.5B-Instruct
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen2.5-0.5B-Instruct
            - name: VLLM_DTYPE
              value: auto
            - name: VLLM_START_MODE
              value: hold
            - name: HF_HOME
              value: /hf-cache
            - name: HUGGINGFACE_HUB_CACHE
              value: /hf-cache/hub
            - name: TRANSFORMERS_CACHE
              value: /hf-cache/transformers
            - name: XDG_CACHE_HOME
              value: /hf-cache/xdg
            - name: VLLM_CACHE_ROOT
              value: /hf-cache/vllm
            - name: TRITON_CACHE_DIR
              value: /hf-cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /hf-cache/torchinductor
            - name: HOME
              value: /tmp
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: pvc-datasight-hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
